<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kompyuter Savodxonligi - Ro'yxatdan o'tish</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-900 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full mx-4">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Ro'yxatdan o'tish</h1>
            <p class="text-sm text-gray-500 mt-2">Ilovadan foydalanish uchun hisob yarating</p>
        </div>

        <form id="registerForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Ismingiz</label>
                <input type="text" id="regName" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none transition-all" placeholder="Alisher">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email manzil</label>
                <input type="email" id="regEmail" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none transition-all" placeholder="misol@gmail.com">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Parol (min 6 belgi)</label>
                <input type="password" id="regPassword" required minlength="6" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none transition-all" placeholder="••••••••">
            </div>
            
            <div id="regErrorMsg" class="text-red-500 text-sm hidden bg-red-50 p-3 rounded-lg"></div>
            <div id="regSuccessMsg" class="text-green-600 text-sm hidden bg-green-50 p-3 rounded-lg">Muvaffaqiyatli! Endi kirishingiz mumkin.</div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition-colors shadow-md">
                <span id="regBtnText">Ro'yxatdan o'tish</span>
            </button>
        </form>
        <div class="mt-6 text-center text-sm">
            Hisobingiz bormi? <a href="index.html" class="text-blue-600 font-semibold hover:underline">Kirish</a>
        </div>
    </div>
    <script type="module" src="./js/app.js"></script>
</body>
</html>
