<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parolni tiklash</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full mx-4 text-center">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Parolni unutdingizmi?</h1>
        <p class="text-sm text-gray-500 mb-6">Email manzilingizni kiriting, biz parolni tiklash havolasini yuboramiz.</p>

        <form id="resetForm" class="space-y-4">
            <input type="email" id="resetEmail" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none text-left" placeholder="Email...">
            
            <div id="resetErrorMsg" class="text-red-500 text-sm hidden bg-red-50 p-3 rounded-lg"></div>
            <div id="resetSuccessMsg" class="text-green-600 text-sm hidden bg-green-50 p-3 rounded-lg">Pochtangizga xat yuborildi! Tekshiring.</div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition-colors">
                Yuborish
            </button>
        </form>
        <div class="mt-6">
            <a href="index.html" class="text-blue-600 text-sm font-semibold hover:underline">Orqaga qaytish</a>
        </div>
    </div>
    <script type="module" src="./js/app.js"></script>
</body>
</html>
