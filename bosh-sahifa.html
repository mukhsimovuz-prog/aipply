<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bosh sahifa - Kompyuter Savodxonligi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .bottom-nav { box-shadow: 0 -4px 20px rgba(0,0,0,0.05); }
        .glass-header { background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 pb-20"> <!-- pb-20 bottom nav uchun joy -->
    
    <!-- Full-Screen Loader -->
    <div id="fullLoader" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center">
        <svg class="animate-spin h-10 w-10 text-blue-600 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <p class="text-gray-500 font-medium">Ma'lumotlar yuklanmoqda...</p>
    </div>

    <!-- Error Banner -->
    <div id="errorBanner" class="hidden fixed top-4 left-4 right-4 bg-red-100 border border-red-200 text-red-700 px-4 py-3 rounded-xl shadow-lg z-50 flex items-center justify-between">
        <span id="errorText">Xatolik yuz berdi.</span>
        <button onclick="document.getElementById('errorBanner').classList.add('hidden')" class="text-red-500 hover:text-red-700 font-bold ml-4">&times;</button>
    </div>

    <!-- Header (Yuqori qism) -->
    <header class="glass-header sticky top-0 z-40 px-5 py-4 flex items-center justify-between shadow-sm border-b border-gray-100">
        <div class="flex items-center space-x-3">
            <div class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold text-xl uppercase shadow-inner" id="userAvatar">A</div>
            <div>
                <p class="text-[10px] text-gray-500 font-semibold uppercase tracking-wider mb-0.5">Xush kelibsiz</p>
                <h1 class="text-lg font-bold text-gray-800 leading-none" id="userName">Foydalanuvchi</h1>
            </div>
        </div>
        <button id="logoutBtn" class="p-2.5 bg-gray-100 rounded-full text-gray-500 hover:bg-red-50 hover:text-red-500 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
        </button>
    </header>

    <main class="p-5 max-w-2xl mx-auto space-y-8">
        
        <!-- Dinamik Banner -->
        <div class="bg-gradient-to-br from-blue-600 to-indigo-600 rounded-2xl p-6 text-white shadow-lg shadow-blue-200/50 relative overflow-hidden">
            <div class="relative z-10">
                <span class="bg-white/20 px-3 py-1 rounded-full text-[10px] font-bold tracking-wider backdrop-blur-md uppercase shadow-sm">Oson va tushunarli</span>
                <h2 class="text-2xl font-extrabold mt-4 mb-2 leading-tight">Kompyuterni<br>0 dan o'rganing!</h2>
                <p class="text-blue-100 text-sm mb-5 opacity-95 max-w-[80%]">Ovozli yo'riqnomalar va sodda tilda tushuntirilgan darslar.</p>
                <button class="bg-white text-blue-600 px-6 py-2.5 rounded-xl font-bold text-sm shadow-md hover:bg-gray-50 transition transform hover:scale-105 active:scale-95">Boshlash</button>
            </div>
            <!-- Bezaklar -->
            <div class="absolute -bottom-10 -right-10 w-48 h-48 bg-white opacity-10 rounded-full blur-2xl"></div>
            <div class="absolute top-0 right-0 w-32 h-32 bg-white opacity-10 rounded-full blur-xl translate-x-1/2 -translate-y-1/2"></div>
        </div>

        <!-- Barcha Kurslar -->
        <section>
            <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center">
                <svg class="w-5 h-5 mr-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                O'quv Dasturlari
            </h3>
            <div id="coursesContainer" class="grid grid-cols-1 gap-4">
                <!-- Loader Skeletons -->
                <div class="bg-white rounded-2xl p-3 shadow-sm border border-gray-100 animate-pulse flex space-x-4">
                    <div class="w-28 h-24 bg-gray-200 rounded-xl"></div>
                    <div class="flex-1 space-y-3 py-2">
                        <div class="h-4 bg-gray-200 rounded w-3/4"></div>
                        <div class="h-3 bg-gray-200 rounded w-1/2"></div>
                        <div class="h-8 bg-gray-200 rounded-lg w-full mt-2"></div>
                    </div>
                </div>
            </div>
        </section>
        
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md flex justify-around items-center h-16 z-40 max-w-2xl mx-auto border-t border-gray-100">
        <a href="bosh-sahifa.html" class="flex flex-col items-center justify-center w-full h-full text-blue-600 transition">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            <span class="text-[10px] font-bold">Asosiy</span>
        </a>
        <a href="#" onclick="alert('Darslarim ekrani navbatdagi bosqichda yasaladi')" class="flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-blue-500 transition">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span class="text-[10px] font-medium">Darslarim</span>
        </a>
        <a href="#" onclick="alert('Profil ekrani navbatdagi bosqichda yasaladi')" class="flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-blue-500 transition">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            <span class="text-[10px] font-medium">Profil</span>
        </a>
    </nav>

    <script type="module" src="./js/dashboard.js"></script>
</body>
</html>
