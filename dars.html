<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dars - Kompyuter Savodxonligi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass-header { background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 12px; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 pb-24">
    
    <div id="fullLoader" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center">
        <svg class="animate-spin h-10 w-10 text-blue-600 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
    </div>

    <!-- Header -->
    <header class="glass-header sticky top-0 z-40 px-4 py-3 flex items-center shadow-sm border-b border-gray-100">
        <button onclick="window.history.back()" class="p-2 -ml-2 rounded-full text-gray-600 hover:bg-gray-100 transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </button>
        <h1 class="text-sm font-bold text-gray-800 line-clamp-1 flex-1 ml-2" id="lessonTitle">Dars yuklanmoqda...</h1>
    </header>

    <main class="max-w-3xl mx-auto p-4 space-y-6">
        <!-- Video Qismi -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-2">
            <div id="videoContainer" class="video-container bg-black rounded-xl">
                <!-- YouTube iframe will be injected here -->
            </div>
        </div>

        <!-- Dars Matni -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
            <h3 class="text-lg font-bold text-gray-800 mb-3 border-b border-gray-100 pb-2">Ma'ruza matni</h3>
            <div id="lessonText" class="prose prose-sm text-gray-600">
                O'qish uchun matn yuklanmoqda...
            </div>
        </div>

        <!-- Mashq -->
        <div class="bg-blue-50 rounded-2xl border border-blue-100 p-5">
            <h3 class="text-lg font-bold text-blue-900 mb-2 flex items-center">
                <svg class="w-5 h-5 mr-2 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                Amaliy Mashq
            </h3>
            <div id="lessonExercise" class="text-sm text-blue-800">
                Mashq sharti yuklanmoqda...
            </div>
        </div>
    </main>

    <!-- Pastki tugma -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 p-4 z-30 max-w-3xl mx-auto flex space-x-3">
        <button id="finishLessonBtn" class="flex-1 bg-green-500 hover:bg-green-600 text-white font-bold py-3.5 rounded-xl transition-colors shadow-lg shadow-green-200">
            Darsni tugatish
        </button>
    </div>

    <!-- AI Yordamchi FAB -->
    <button class="fixed bottom-24 right-5 w-14 h-14 bg-gradient-to-tr from-purple-600 to-blue-500 rounded-full shadow-xl shadow-purple-200 flex items-center justify-center text-white hover:scale-110 active:scale-95 transition-transform z-40" onclick="alert('AI Yordamchi tez orada qo\'shiladi!')">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
    </button>

    <script type="module" src="./js/dars.js"></script>
</body>
</html>
