<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kurs - Kompyuter Savodxonligi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .bottom-nav { box-shadow: 0 -4px 20px rgba(0,0,0,0.05); }
        .glass-header { background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 pb-24">
    
    <!-- Loader -->
    <div id="fullLoader" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center">
        <svg class="animate-spin h-10 w-10 text-blue-600 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
    </div>

    <!-- Header (Orqaga qaytish) -->
    <header class="glass-header sticky top-0 z-40 px-5 py-4 flex items-center justify-between shadow-sm border-b border-gray-100">
        <button onclick="window.location.href='bosh-sahifa.html'" class="p-2 -ml-2 rounded-full text-gray-600 hover:bg-gray-100 transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </button>
        <h1 class="text-base font-bold text-gray-800 line-clamp-1 flex-1 text-center pr-6" id="headerTitle">Kurs Dasturi</h1>
    </header>

    <main class="max-w-2xl mx-auto">
        <!-- Kurs rasmi va ma'lumoti -->
        <div class="bg-white px-5 pt-6 pb-8 border-b border-gray-100 shadow-sm">
            <img id="courseCover" src="" class="w-full h-48 md:h-64 object-cover rounded-2xl bg-blue-50 mb-5 shadow-sm hidden">
            <div id="courseCoverPlaceholder" class="w-full h-48 bg-gradient-to-tr from-blue-100 to-indigo-50 rounded-2xl mb-5 flex items-center justify-center">
                <svg class="w-16 h-16 text-blue-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
            </div>
            
            <h2 id="courseTitle" class="text-2xl font-extrabold text-gray-900 mb-2 leading-tight">Kurs Nomi</h2>
            <p id="courseDesc" class="text-sm text-gray-600 mb-5 leading-relaxed">Kurs tavsifi bu yerda chiqadi.</p>
            
            <div class="flex items-center justify-between p-4 bg-gray-50 rounded-xl border border-gray-100">
                <div class="flex items-center space-x-3 text-gray-700">
                    <svg class="w-6 h-6 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <div>
                        <p class="text-[10px] uppercase font-bold text-gray-400">Kurs narxi</p>
                        <p id="coursePrice" class="font-bold text-gray-800 text-lg">Bepul</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modullar (Mundarija) -->
        <div class="p-5">
            <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center">
                <svg class="w-5 h-5 mr-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                Darslar mundarijasi
            </h3>
            
            <div id="modulesContainer" class="space-y-4">
                <!-- Javascript orqali to'ldiriladi -->
            </div>
        </div>
    </main>

    <!-- Pastki tugma (Sotib olish / Davom ettirish) -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 p-4 z-40 max-w-2xl mx-auto shadow-[0_-10px_20px_rgba(0,0,0,0.03)]">
        <button id="actionBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition-colors shadow-lg shadow-blue-200 flex justify-center items-center">
            Darsni boshlash
        </button>
    </div>

    <script type="module" src="./js/kurs.js"></script>
</body>
</html>
